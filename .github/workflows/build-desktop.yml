name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win
            artifact-name: ProfileDesk-Windows
            artifact-path: release/*.exe
          - os: macos-latest
            command: npm run dist:mac:x64
            artifact-name: ProfileDesk-macOS-Intel
            artifact-path: release/*.dmg
          - os: macos-latest
            command: npm run dist:mac:arm64
            artifact-name: ProfileDesk-macOS-AppleSilicon
            artifact-path: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --allow-git=all
      - run: npm run verify
      - name: Build Windows package
        if: runner.os == 'Windows'
        run: ${{ matrix.command }}
      - name: Build macOS package
        if: runner.os == 'macOS'
        run: ${{ matrix.command }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          compression-level: 0
